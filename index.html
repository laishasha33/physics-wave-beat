<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WAVE BEAT">
<title>WAVE BEAT 波動節拍</title>
<style>
:root{--bg:#0b1020;--panel:#151d38;--panel2:#1d2850;--ink:#eef3ff;--dim:#93a1c4;--cyan:#38e1ff;--pink:#ff4fa0;--gold:#ffd166;--green:#4ade80;--red:#ff5d5d;--violet:#a78bfa}
*{box-sizing:border-box}
html,body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn,.opt,.card{touch-action:manipulation}
#ctl6 .btn{min-width:56px;min-height:48px}
#fSlider{height:40px;touch-action:pan-x}
.scr{position:fixed;inset:0;display:none;overflow-y:auto;padding:20px 16px 40px;background:radial-gradient(1200px 700px at 50% -10%,#1f2b5c 0%,#0b1020 60%);z-index:5;touch-action:pan-y}
.scr.on{display:block}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.78);z-index:8;padding:16px;touch-action:pan-y}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid #2c3a70;border-radius:18px;max-width:760px;width:100%;padding:22px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(34px,7vw,64px);margin:6px 0 0;letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
h2{margin:0 0 8px;font-size:24px}
.sub{color:var(--dim);margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid #2c3a70;border-radius:16px;padding:16px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--cyan)}
.card .no{font-size:13px;color:var(--cyan);font-weight:700;letter-spacing:1px}
.card .nm{font-size:22px;font-weight:800;margin:4px 0}
.card .tp{font-size:13px;color:var(--dim)}
.card .rk{position:absolute;right:14px;top:12px;font-size:28px;font-weight:900}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer;color:#0b1020;background:var(--cyan);margin:6px 6px 0 0;font-family:inherit}
.btn.alt{background:#2a3870;color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:var(--panel2);border:2px solid #34437e;border-radius:12px;padding:14px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--cyan)}
.opt.ok{border-color:var(--green);background:#123a2a}
.opt.no{border-color:var(--red);background:#3a1620}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:#26346a;color:var(--cyan);margin-right:6px}
.big{font-size:20px;line-height:1.6}
.dim{color:var(--dim)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px}
td,th{border:1px solid #2c3a70;padding:7px 9px;text-align:center}
th{background:#1d2850;color:var(--cyan)}
.phys{background:#101733;border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:12px 0;line-height:1.7}
.phys b{color:var(--gold)}
input[type=text]{background:#0f1630;border:1px solid #34437e;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:17px;font-family:inherit;width:220px}
#hudBtns{position:fixed;left:10px;top:10px;z-index:4;display:none}
#hudBtns .btn{padding:8px 12px;font-size:14px;margin:0}
#ctl6{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:none;gap:8px;align-items:center;background:rgba(12,18,40,.85);padding:10px 12px;border-radius:14px;border:1px solid #2c3a70}
#ctl6 .btn{margin:0;padding:10px 14px}
#ctl6 input{width:min(42vw,360px)}
.dseimg{width:100%;background:#fff;border-radius:10px;padding:8px;margin:10px 0}
.res-rank{font-size:96px;font-weight:900;line-height:1;margin:6px 0}
.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.small{font-size:13px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudBtns"><button class="btn alt" id="quitBtn">✕ 離開</button></div>
<div id="ctl6">
  <button class="btn alt" data-df="-1">−1</button><button class="btn alt" data-df="-0.1">−0.1</button>
  <input type="range" id="fSlider" min="0.5" max="12" step="0.1" value="1">
  <button class="btn alt" data-df="0.1">+0.1</button><button class="btn alt" data-df="1">+1</button>
</div>

<!-- 主畫面 -->
<div class="scr on" id="scrTitle"><div class="wrap">
  <h1>WAVE BEAT</h1>
  <div style="font-size:26px;font-weight:800;margin-top:2px">波動節拍</div>
  <p class="sub">中五物理 · 第 4–7 課 波動　｜　在節奏遊戲裏，拍子就是週期，譜面就是位移—時間關係線圖。</p>
  <div class="flex" style="margin-bottom:16px">
    <input type="text" id="pname" maxlength="12" placeholder="你的名字（可不填）">
    <button class="btn alt" id="helpBtn">玩法和物理對照</button>
  </div>
  <div class="grid" id="lvGrid"></div>
  <p class="dim small" style="margin-top:18px">操作：電腦按 <b>空白鍵</b>（第 3 關：F／J；第 7 關：D F J K）；平板和手機直接按畫面。每關完結有 DSE 真題「加倍時間」。</p>
</div></div>

<!-- 關卡介紹 -->
<div class="scr" id="scrIntro"><div class="wrap" style="max-width:760px">
  <div id="introBody"></div>
  <button class="btn" id="introGo">開始 ▶</button><button class="btn alt" id="introBack">返回</button>
</div></div>

<!-- 結果 -->
<div class="scr" id="scrResult"><div class="wrap" style="max-width:820px"><div id="resBody"></div></div></div>

<!-- 預測／選擇 -->
<div class="modal" id="mdPredict"><div class="box" id="predBody"></div></div>
<!-- 說明 -->
<div class="modal" id="mdHelp"><div class="box" id="helpBody"></div></div>

<script>
"use strict";
// ═════════════════════════ 基本工具 ═════════════════════════
const $ = s => document.querySelector(s);
const cv = $('#cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();
const TAU = Math.PI * 2;
const TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d);
const C = {bg:'#0b1020', ink:'#eef3ff', dim:'#93a1c4', cyan:'#38e1ff', pink:'#ff4fa0', gold:'#ffd166', green:'#4ade80', red:'#ff5d5d', violet:'#a78bfa', line:'#2c3a70'};
function txt(s, x, y, size = 16, color = C.ink, align = 'left', bold = false, base = 'alphabetic') {
  g.font = `${bold ? '800 ' : ''}${size}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y);
}
function rr(x, y, w, h, r, fill, stroke) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); }
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('wavebeat_' + k)); localStorage.setItem('wavebeat_' + k, JSON.stringify(v)); } catch (e) { return null; } }
function seeded(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ═════════════════════════ 聲音 ═════════════════════════
let AC = null, master = null, musicBus = null;
function audioInit() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
  }
  if (AC.state === 'suspended' || AC.state === 'interrupted') AC.resume();
  // iPad／iPhone：令網頁聲音不受靜音鍵影響
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!silentEl) { try { silentEl = new Audio(silentWav()); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); silentEl.play().catch(() => {}); } catch (e) {} }
}
let silentEl = null;
function silentWav() {   // 0.5 秒無聲 WAV（8 kHz，8 位元）
  const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
  let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(bin);
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (AC) { if (AC.state !== 'running') AC.resume(); } }, {passive: true}));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state !== 'running') AC.resume(); });
const clock = () => AC ? AC.currentTime : performance.now() / 1000;
let noiseBuf = null;
function noise() {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function env(t, a, d, peak, dest) { const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(peak, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); gn.connect(dest); return gn; }
const SFX = {
  kick(t, v = 0.7, dest = musicBus) { const o = AC.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); o.connect(env(t, 0.004, 0.22, v, dest)); o.start(t); o.stop(t + 0.3); },
  hat(t, v = 0.09, dest = musicBus) { const s = AC.createBufferSource(); s.buffer = noise(); const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000; s.connect(f); f.connect(env(t, 0.002, 0.05, v, dest)); s.start(t); s.stop(t + 0.08); },
  tone(t, freq, dur = 0.3, type = 'triangle', v = 0.12, dest = musicBus) { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); o.connect(env(t, 0.01, dur, v, dest)); o.start(t); o.stop(t + dur + 0.05); },
  click(t) { this.tone(t, 1600, 0.04, 'square', 0.05, master); },
  perfect() { const t = clock(); this.tone(t, 1318, 0.12, 'sine', 0.08, master); this.tone(t + 0.04, 1760, 0.14, 'sine', 0.06, master); },
  good() { this.tone(clock(), 988, 0.1, 'sine', 0.06, master); },
  miss() { this.tone(clock(), 140, 0.18, 'sawtooth', 0.06, master); },
  win() { const t = clock(); [523, 659, 784, 1046].forEach((f, i) => this.tone(t + i * 0.09, f, 0.25, 'triangle', 0.1, master)); },
  lose() { const t = clock(); [392, 330, 262].forEach((f, i) => this.tone(t + i * 0.12, f, 0.25, 'triangle', 0.08, master)); }
};
// 和弦進行（A 小調）：每拍一個低音
const BASS = [110, 110, 87.3, 87.3, 130.8, 130.8, 98, 98];
const LEAD = [440, 523, 587, 659, 587, 523, 494, 440, 392, 440, 494, 523];
// 在音符（拍子）時間上排一首歌：鼓在拍上，低音和主旋律跟着拍子走
function songOnBeats(times, opt = {}) {
  const ev = [];
  times.forEach((t, i) => {
    ev.push({t, f: tt => SFX.kick(tt, 0.65)});
    ev.push({t, f: tt => SFX.tone(tt, BASS[i % 8], 0.35, 'triangle', 0.13)});
    if (!opt.noLead && i % 2 === 0) ev.push({t, f: tt => SFX.tone(tt, LEAD[(i / 2) % LEAD.length], 0.22, 'square', 0.035)});
    const nx = times[i + 1];
    if (nx && nx - t > 0.35) ev.push({t: (t + nx) / 2, f: tt => SFX.hat(tt)});
  });
  return ev;
}
function countIn(first, period, n = 4) { const ev = []; for (let k = n; k >= 1; k--) ev.push({t: first - k * period, f: tt => SFX.hat(tt, 0.16), ci: true}); return ev; }

// ═════════════════════════ 波源（相位隨時間累積，可中途改頻率／振幅） ═════════════════════════
class Source {
  constructor(segs) { let t = 0, ph = 0; this.segs = segs.map(s => { const o = {...s, t0: t, ph0: ph}; t += s.dur; ph += TAU * s.f * s.dur; return o; }); this.end = t; }
  seg(tau) { let s = this.segs[0]; for (const q of this.segs) if (tau >= q.t0) s = q; return s; }
  y(tau) { if (tau < 0 || tau > this.end) return 0; const s = this.seg(tau); return s.A * Math.sin(s.ph0 + TAU * s.f * (tau - s.t0)); }
  // 波源在 tau 時到達最高點的時刻（相位 = π/2 + 2πk）
  crests() { const out = []; for (const s of this.segs) { let k = Math.ceil((s.ph0 - Math.PI / 2) / TAU - 1e-9); for (;; k++) { const ph = Math.PI / 2 + TAU * k; const tau = s.t0 + (ph - s.ph0) / (TAU * s.f); if (tau >= s.t0 + s.dur - 1e-9) break; if (tau >= s.t0 - 1e-9) out.push({tau, f: s.f, A: s.A}); } } return out; }
}

// ═════════════════════════ 判定 ═════════════════════════
const WIN = {P: 0.07, G: 0.13, D: 0.2};
const GRADE = {P: {w: 1, n: 'PERFECT', c: C.gold}, G: {w: 0.75, n: 'GREAT', c: C.cyan}, D: {w: 0.45, n: 'GOOD', c: C.green}, M: {w: 0, n: 'MISS', c: C.red}};
let S = null;            // 正在玩的狀態
let fx = [];             // 浮動文字
function addFx(s, x, y, c, size = 26) { fx.push({s, x, y, c, size, t: performance.now()}); }
function judge(st, grade, x, y) {
  const w = GRADE[grade].w;
  if (grade === 'M') { st.combo = 0; SFX.miss(); } else { st.combo++; st.maxCombo = Math.max(st.maxCombo, st.combo); grade === 'P' ? SFX.perfect() : SFX.good(); }
  st.score += Math.round(1000 * w * (1 + Math.min(st.combo, 50) * 0.02));
  st.acc.push(w); st.counts[grade]++;
  addFx(GRADE[grade].n, x, y, GRADE[grade].c);
}
function gradeOf(dt) { dt = Math.abs(dt); return dt <= WIN.P ? 'P' : dt <= WIN.G ? 'G' : dt <= WIN.D ? 'D' : null; }

// 通用節奏判定：notes = [{t, lane}]，按 lane 找最近而未判定的音符
function tapNotes(ph, lane, gt, x, y) {
  let best = null, bd = 9;
  for (const n of ph.notes) { if (n.done || n.lane !== lane) continue; const d = gt - n.t; if (Math.abs(d) < bd) { bd = Math.abs(d); best = n; } }
  const gr = best ? gradeOf(gt - best.t) : null;
  if (best && gr) { best.done = true; best.grade = gr; best.tapT = gt; judge(S, gr, x, y); ph.taps.push({t: gt, lane, grade: gr}); return gr; }
  ph.taps.push({t: gt, lane, grade: 'X'}); stray(x, y);
  return null;
}
// 沒有拍子時亂按：當作 MISS，連擊歸零
function stray(x, y) { S.combo = 0; S.acc.push(0); S.counts.M++; SFX.miss(); addFx('亂按', x, y, C.red, 20); }
function sweepMiss(ph, gt, x, y) {
  for (const n of ph.notes) if (!n.done && gt - n.t > WIN.D) { n.done = true; n.grade = 'M'; judge(S, 'M', typeof x === 'function' ? x(n) : x, typeof y === 'function' ? y(n) : y); }
}

// ═════════════════════════ 繪圖：一維的繩／水面 ═════════════════════════
function stringBox() { const top = 110, bot = Math.min(H - 190, top + 300); return {x: 40, y: top, w: W - 80, h: bot - top}; }
function drawString(box, L, yfun, opt = {}) {
  const cy = box.y + box.h / 2, sc = box.h * 0.36 / (opt.Amax || 1);
  const X = x => box.x + x / L * box.w, Y = y => cy - y * sc;
  if (opt.water) {
    g.beginPath(); g.moveTo(X(0), Y(yfun(0)));
    for (let i = 1; i <= 240; i++) { const x = L * i / 240; g.lineTo(X(x), Y(yfun(x))); }
    g.lineTo(X(L), box.y + box.h); g.lineTo(X(0), box.y + box.h); g.closePath();
    const gr = g.createLinearGradient(0, box.y, 0, box.y + box.h); gr.addColorStop(0, 'rgba(56,225,255,.55)'); gr.addColorStop(1, 'rgba(20,60,140,.25)');
    g.fillStyle = gr; g.fill();
  } else {
    g.strokeStyle = 'rgba(147,161,196,.35)'; g.setLineDash([6, 6]); g.lineWidth = 1; g.beginPath(); g.moveTo(X(0), cy); g.lineTo(X(L), cy); g.stroke(); g.setLineDash([]);
  }
  g.strokeStyle = opt.color || C.cyan; g.lineWidth = 3; g.beginPath();
  for (let i = 0; i <= 240; i++) { const x = L * i / 240; const px = X(x), py = Y(yfun(x)); i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke();
  if (!opt.water) for (let i = 0; i <= 32; i++) { const x = L * i / 32; g.fillStyle = 'rgba(238,243,255,.75)'; g.beginPath(); g.arc(X(x), Y(yfun(x)), 3.2, 0, TAU); g.fill(); }
  return {X, Y, cy, sc};
}
function crestsOn(L, yfun, thr) { const xs = [], N = 400; let prev = yfun(0), cur = yfun(L / N); for (let i = 1; i < N; i++) { const nx = yfun(L * (i + 1) / N); if (cur > prev && cur >= nx && cur > thr) xs.push(L * i / N); prev = cur; cur = nx; } return xs; }
function drawDuck(px, py, glow, label = 'P') {
  if (glow > 0) { g.fillStyle = `rgba(255,209,102,${0.35 * glow})`; g.beginPath(); g.arc(px, py, 26 + 10 * glow, 0, TAU); g.fill(); }
  const y0 = py - 12;
  g.fillStyle = '#ffd43b'; g.beginPath(); g.ellipse(px, y0 + 4, 17, 11, 0, 0, TAU); g.fill();
  g.beginPath(); g.arc(px + 9, y0 - 9, 8.5, 0, TAU); g.fill();
  g.fillStyle = '#ff8c1a'; g.beginPath(); g.moveTo(px + 16, y0 - 10); g.lineTo(px + 26, y0 - 7); g.lineTo(px + 16, y0 - 5); g.closePath(); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.arc(px + 11, y0 - 11, 1.8, 0, TAU); g.fill();
  g.fillStyle = '#f2b705'; g.beginPath(); g.ellipse(px - 3, y0 + 3, 8, 5, -0.3, 0, TAU); g.fill();
  txt(label, px, py + 30, 15, C.gold, 'center', true);
}
// 位移—時間關係線圖小窗：過去實線、將來虛線、拍子點
function drawST(box, yP, gt, taps, title, Amax = 1, span = [-3, 1.6]) {
  rr(box.x, box.y, box.w, box.h, 12, 'rgba(16,23,51,.92)', C.line);
  txt(title, box.x + 12, box.y + 20, 14, C.gold, 'left', true);
  const t0 = gt + span[0], t1 = gt + span[1], cy = box.y + box.h / 2 + 8, sc = (box.h * 0.32) / Amax;
  const X = t => box.x + 10 + (t - t0) / (t1 - t0) * (box.w - 20);

// 一維均勻介質（或分區介質）的波：判定粒子在 xP
function wave1D(o) {
  const src = new Source(o.segs);
  const tau = o.tau || (x => x / o.v);
  const yAt = (x, t) => src.y(t - tau(x));
  const tauP = tau(o.xP);
  const cr0 = src.crests(), beats = cr0.map(c => c.tau + tauP);
  const notes = beats.map((t, i) => ({t, lane: 0, seg: o.segs.findIndex(sg => sg.f === cr0[i].f && sg.A === cr0[i].A)}));
  const per = 1 / o.segs[0].f;
  const events = [...countIn(notes[0].t, per), ...songOnBeats(beats)];
  const Amax = Math.max(...o.segs.map(s => s.A));
  const ph = {notes, events, taps: [], dur: beats[beats.length - 1] + 1.2, banner: o.banner, info: {o, src},
    yP: t => yAt(o.xP, t),
    draw(gt) {
      const box = stringBox();
      const yf = x => yAt(x, gt);
      const m = drawString(box, o.L, yf, {Amax: 1, water: o.water});
      if (o.drawExtra) o.drawExtra(box, m, gt);
      // 正在逼近 P 的波峯
      const cr = crestsOn(o.L, yf, 0.25 * Amax);
      for (const x of cr) { const near = x <= o.xP + 0.05 && o.xP - x < 1.6; g.fillStyle = near ? C.gold : 'rgba(255,209,102,.45)'; g.beginPath(); const px = m.X(x), py = m.Y(yf(x)) - 16; g.moveTo(px, py); g.lineTo(px - 7, py - 12); g.lineTo(px + 7, py - 12); g.closePath(); g.fill(); }
      const py = m.Y(yf(o.xP)), next = notes.find(n => !n.done);
      const glow = next ? clamp(1 - Math.abs(gt - next.t) / 0.25, 0, 1) : 0;
      g.strokeStyle = 'rgba(255,209,102,.35)'; g.setLineDash([4, 6]); g.beginPath(); g.moveTo(m.X(o.xP), box.y); g.lineTo(m.X(o.xP), box.y + box.h); g.stroke(); g.setLineDash([]);
      drawDuck(m.X(o.xP), py, glow);
      // 波源
      g.fillStyle = C.pink; g.fillRect(m.X(0) - 8, m.Y(src.y(gt)) - 8, 16, 16); txt('波源', m.X(0), box.y + box.h + 18, 13, C.pink, 'center');
      const s = src.seg(clamp(gt - tauP, 0, src.end));
      hudTop([`f = ${fmt(s.f, 2)} Hz　T = ${fmt(1 / s.f, 2)} s　振幅 = ${fmt(s.A, 1)} m　v = ${fmt(o.v, 1)} m/s`, `按的時機：P 升到最高點　｜　${TOUCH ? '按畫面任何位置' : '空白鍵'}`]);
      drawST({x: 40, y: H - 120, w: W - 80, h: 104}, ph.yP, gt, ph.taps, 'P 的位移—時間關係線圖（你的拍子 = 圓點）');
      sweepMiss(ph, gt, m.X(o.xP), py - 50);
    },
    input(lane, gt) { const box = stringBox(); tapNotes(ph, 0, gt, box.x + o.xP / o.L * box.w, box.y + 20); }
  };
  return ph;
}
function periodTable(st) {
  const rows = [];
  st.phaseLog.filter(p => p.notes).forEach(p => {
    const segs = p.info.o.segs;
    segs.forEach((sg, si) => {
      const T = 1 / sg.f, ints = [], ns = p.notes.filter(n => n.seg === si);
      for (let i = 1; i < ns.length; i++) if (ns[i].tapT !== undefined && ns[i - 1].tapT !== undefined) ints.push(ns[i].tapT - ns[i - 1].tapT);
      rows.push(`<tr><td>${fmt(sg.f, 2)} Hz</td><td>${fmt(sg.A, 1)} m</td><td>${fmt(T, 2)} s</td><td>${ints.length ? fmt(ints.reduce((a, b) => a + b) / ints.length, 2) + ' s' : '—'}</td></tr>`);
    });
  });
  return `<table><tr><th>頻率 f</th><th>振幅</th><th>週期 T = 1/f</th><th>你兩下拍子的平均間隔</th></tr>${rows.join('')}</table>
  <div class="phys">你的拍子間隔 ≈ <b>週期 T</b>。頻率越高，週期越短，拍子越快。<br>振幅加倍時拍子<b>沒有改變</b> ⇒ 週期與振幅無關。</div>`;
}

function sourceRound(r, choice) {

      const cr = crestsOn(L, yf, 0.3);
      for (const mx of marks) {

function rankOf(acc) { return acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D'; }
const RC = {S: C.gold, A: C.pink, B: C.cyan, C: C.green, D: C.dim};
function show(id) { document.querySelectorAll('.scr').forEach(e => e.classList.toggle('on', e.id === id)); $('#hudBtns').style.display = id ? 'none' : 'block'; }
function buildGrid() {
  const best = store('best') || {};
  $('#lvGrid').innerHTML = LV.map((lv, i) => { const b = best[i]; return `<div class="card" data-i="${i}"><div class="no">${lv.no}</div><div class="nm">${lv.name}</div><div class="tp">${lv.topic}</div>
    ${b ? `<div class="rk" style="color:${RC[b.rank]}">${b.rank}</div><div class="tp" style="margin-top:6px">最高分 ${b.score}</div>` : ''}</div>`; }).join('');
  document.querySelectorAll('#lvGrid .card').forEach(c => c.addEventListener('click', () => intro(+c.dataset.i)));
}
function intro(i) {
  audioInit();
  const lv = LV[i];
  $('#introBody').innerHTML = `<div class="no" style="color:var(--cyan);font-weight:700">${lv.no}　<span class="tag">${lv.topic}</span><span class="tag">${lv.tbook}</span></div>
    <h2 style="font-size:34px;margin:8px 0">${lv.name}</h2><p class="big">${lv.story}</p><p class="big">🎯 ${lv.goal}</p>
    <div class="phys">🔬 物理：${lv.physics}</div>`;
  show('scrIntro'); $('#introGo').onclick = () => start(i);
}
function start(i) {
  audioInit();
  S = {i, lv: LV[i], pi: -1, score: 0, combo: 0, maxCombo: 0, acc: [], counts: {P: 0, G: 0, D: 0, M: 0}, phaseLog: [], askOk: 0, askN: 0, lastChoice: {}};
  show(null); nextPhase();
}
function nextPhase() {
  stopPhaseAudio();
  S.pi++;
  const p = S.lv.phases[S.pi];
  if (!p) return finish();
  if (p.kind === 'ask') return ask(p);
  const ph = p.make(S); S.ph = ph; S.phaseLog.push(ph);
  const lead = 0.8;
  S.T0 = clock() + lead; S.evI = 0; ph.events.sort((a, b) => a.t - b.t);
  const minT = ph.events.length ? Math.min(0, ph.events[0].t) : 0; S.T0 -= minT;
  musicBus.gain.cancelScheduledValues(0); musicBus.gain.value = 1;
  $('#ctl6').style.display = ph.needsCtl ? 'flex' : 'none';
  if (ph.needsCtl) { drone = AC.createOscillator(); drone.type = 'triangle'; droneG = AC.createGain(); droneG.gain.value = 0.02; drone.connect(droneG); droneG.connect(master); drone.start(); }
  ph.scoreStart = S.score; ph.accStart = S.acc.length;
}
function stopPhaseAudio() { if (drone) { try { drone.stop(); } catch (e) {} drone = null; } $('#ctl6').style.display = 'none'; }
function ask(p) {
  const md = $('#mdPredict');
  $('#predBody').innerHTML = `<div class="tag">${p.round !== undefined ? '計算' : '預測'}</div><h2 style="margin-top:10px">${p.q}</h2>
    <div class="opts">${p.opts.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="predWhy"></div>`;
  md.classList.add('on');
  md.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const j = +b.dataset.j, ok = j === p.ans; S.askN++;
    if (p.round !== undefined) S.lastChoice[p.round] = j;
    md.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.j === p.ans) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    if (ok) { S.askOk++; S.score += 2000; SFX.win(); } else SFX.lose();
    $('#predWhy').innerHTML = `<div class="phys">${ok ? '✓ 答對！+2000　' : '✗ 不對。'}${p.why}${!ok && p.round !== undefined ? '<br>這回合會用你揀的頻率播放，看看波峯能不能對位。' : ''}</div><button class="btn" id="predNext">繼續 ▶</button>`;
    $('#predNext').onclick = () => { md.classList.remove('on'); nextPhase(); };
  });
}
function finish() {
  stopPhaseAudio(); S.ph = null;
  const acc = S.acc.length ? S.acc.reduce((a, b) => a + b, 0) / S.acc.length : 0;
  S.rank = rankOf(acc); S.accV = acc;
  const lv = S.lv;
  $('#resBody').innerHTML = `<div class="no" style="color:var(--cyan);font-weight:700">${lv.no}　${lv.name}　完成！</div>
    <div class="flex"><div class="res-rank" style="color:${RC[S.rank]}">${S.rank}</div>
    <div class="big">分數 <b style="color:var(--gold)">${S.score}</b><br>準確度 ${fmt(acc * 100, 0)}%　最高連擊 ${S.maxCombo}<br>
    <span class="dim small">PERFECT ${S.counts.P}　GREAT ${S.counts.G}　GOOD ${S.counts.D}　MISS ${S.counts.M}　｜　預測 ${S.askOk}/${S.askN}</span></div></div>
    <h2 style="margin-top:16px">🔬 剛才的物理</h2>${lv.debrief(S)}
    <button class="btn pink" id="bossGo">⚡ DSE 加倍時間：答對分數 ×2</button><button class="btn alt" id="resBack">略過，返回</button>`;
  show('scrResult'); SFX.win();
  $('#bossGo').onclick = boss; $('#resBack').onclick = () => saveAndHome(false);
}
function boss() {
  const b = S.lv.boss;
  $('#resBody').innerHTML = `<div class="tag">${b.tag}</div><span class="tag">全港答對率 ${b.pct}%</span>
    <h2 style="margin-top:10px">⚡ DSE 加倍時間</h2><img class="dseimg" src="${DSE[b.q] || ''}" alt="${b.tag}">
    <div class="opts">${['A', 'B', 'C', 'D'].map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="bossWhy"></div>`;
  document.querySelectorAll('#resBody .opt').forEach(btn => btn.onclick = () => {
    const j = +btn.dataset.j, ok = j === b.ans;
    document.querySelectorAll('#resBody .opt').forEach(x => { x.disabled = true; if (+x.dataset.j === b.ans) x.classList.add('ok'); });
    if (!ok) btn.classList.add('no');
    if (ok) { S.score *= 2; SFX.win(); } else SFX.lose();
    $('#bossWhy').innerHTML = `<div class="phys">${ok ? `✓ 答對！分數加倍：<b>${S.score}</b><br>` : '✗ 不對，分數不變。<br>'}答案：${'ABCD'[b.ans]}　${b.why}</div><button class="btn" id="bossDone">完成，返回選關</button>`;
    $('#bossDone').onclick = () => saveAndHome(true);
    $('#bossWhy').scrollIntoView({behavior: 'smooth', block: 'start'});
  });
  $('#scrResult').scrollTop = 0;
}
function saveAndHome() {
  const best = store('best') || {}; const cur = best[S.i];
  if (!cur || S.score > cur.score) best[S.i] = {score: S.score, rank: S.rank};
  store('best', best);
  const log = store('log') || []; log.push({lv: S.i + 1, name: $('#pname').value || '', score: S.score, rank: S.rank, at: new Date().toISOString()}); store('log', log.slice(-200));
  S = null; buildGrid(); show('scrTitle');
}
$('#introBack').onclick = () => show('scrTitle');
$('#quitBtn').onclick = () => { stopPhaseAudio(); $('#mdPredict').classList.remove('on'); S = null; show('scrTitle'); };
$('#helpBtn').onclick = () => {
  $('#helpBody').innerHTML = `<h2>玩法和物理對照</h2>
  <table><tr><th>節奏遊戲裏</th><th>物理裏</th></tr>
  <tr><td>拍子之間的時間</td><td>週期 T</td></tr><tr><td>每秒幾拍（BPM ÷ 60）</td><td>頻率 f</td></tr>
  <tr><td>音符（波峯）向判定點移動的速度</td><td>波速 v</td></tr><tr><td>音符之間的距離</td><td>波長 λ</td></tr>
  <tr><td>譜面</td><td>粒子的位移—時間關係線圖</td></tr><tr><td>兩條軌道交替／同時</td><td>反相／同相</td></tr></table>
  <div class="phys">每關都有「預測」：在畫面改變之前先估一估，答對 +2000。每關完結有 DSE 真題「加倍時間」。<br>評級：S ≥ 95%、A ≥ 85%、B ≥ 70%、C ≥ 50%。</div>
  <button class="btn" onclick="document.getElementById('mdHelp').classList.remove('on')">知道了</button>`;
  $('#mdHelp').classList.add('on');
};

// ═════════════════════════ 輸入 ═════════════════════════
const KEYLANE = {Space: 0, KeyF: 0, KeyJ: 1, KeyD: 0, KeyK: 3, Enter: 0};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!S || !S.ph || $('#mdPredict').classList.contains('on')) return;
  if (e.repeat) return;
  const ph = S.ph; let lane = null;
  if (ph.lanes === 4) lane = {KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3}[e.code];
  else if (ph.lanes === 2) lane = {KeyF: 0, KeyD: 0, KeyJ: 1, KeyK: 1, Space: 0}[e.code];
  else lane = e.code in KEYLANE ? 0 : null;
  if (ph.stState) { if (e.code === 'ArrowUp') setF(ph.stState.f + 1); if (e.code === 'ArrowDown') setF(ph.stState.f - 1); }
  if (lane !== null && lane !== undefined && !ph.noTap) { e.preventDefault(); ph.input(lane, clock() - S.T0); }
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function worldPt(e) { const m = S.ph._map; return {x: (e.clientX - m.ox) / m.sc, y: (m.oy - e.clientY) / m.sc}; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!S || !S.ph || $('#mdPredict').classList.contains('on')) return; const ph = S.ph;
  if (ph._map) { ph.drag = worldPt(e); cv.setPointerCapture(e.pointerId); return; }
  if (ph.noTap) return;
  let lane = 0;
  if (ph.lanes === 4) lane = clamp(Math.floor((e.clientX - 20) / ((W - 40) / 4)), 0, 3);
  else if (ph.lanes === 2) lane = e.clientX < W / 2 ? 0 : 1;
  ph.input(lane, clock() - S.T0);
});
cv.addEventListener('pointermove', e => { if (S && S.ph && S.ph.drag) S.ph.drag = worldPt(e); });
['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, () => { if (S && S.ph) S.ph.drag = null; }));
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ═════════════════════════ 主迴圈 ═════════════════════════
let lastF = performance.now();
function frame() {
  if (window.__freeze) return requestAnimationFrame(frame);
  const nowp = performance.now(), dt = Math.min(0.05, (nowp - lastF) / 1000); lastF = nowp;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  // 背景格線
  g.strokeStyle = 'rgba(44,58,112,.25)'; g.lineWidth = 1; for (let x = (nowp / 40) % 60; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  if (S && S.ph && !$('#mdPredict').classList.contains('on')) {
    const ph = S.ph, gt = clock() - S.T0;
    while (S.evI < ph.events.length && ph.events[S.evI].t + S.T0 < clock() + 0.15) { const ev = ph.events[S.evI++]; const at = ev.t + S.T0; if (at > clock() - 0.02) ev.f(Math.max(at, clock())); }
    if (ph.update) ph.update(dt, gt);
    ph.draw(gt);
    const firstT = ph.notes.length ? Math.min(...ph.notes.map(n => n.t)) : 0;
    drawCountdown(gt, firstT);
    drawFx();
    if (gt > ph.dur) {
      if (ph.scoreMul) { const gained = S.score - ph.scoreStart; S.score = ph.scoreStart + Math.round(gained * ph.scoreMul); }
      nextPhase();
    }
  }
  requestAnimationFrame(frame);
}
buildGrid(); requestAnimationFrame(frame);
$('#pname').value = store('name') || ''; $('#pname').addEventListener('change', () => store('name', $('#pname').value));

// 測試用：__wb.still(關卡, 第幾個 phase, 遊戲時間) 畫出一格靜止畫面（不用聲音）
window.__wb = {LV, still(i, pi, gt) { window.__freeze = true; audioInit(); S = {i, lv: LV[i], score: 0, combo: 0, maxCombo: 0, acc: [], counts: {P: 0, G: 0, D: 0, M: 0}, phaseLog: [], lastChoice: {}}; const ph = LV[i].phases[pi].make(S); S.ph = ph; show(null); g.fillStyle = C.bg; g.fillRect(0, 0, W, H); ph.draw(gt); drawCountdown(gt, ph.notes.length ? Math.min(...ph.notes.map(n => n.t)) : 0); S.ph = null; return ph; }};
</script>
